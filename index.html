<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieMenu - Thực đơn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand" href="#">🍔 FoodieMenu</a>
        </div>
    </nav>
    <div class="row mb-4">
        <div class="col-md-6 mb-3 mb-md-0">
            <input type="text" id="search-input" class="form-control" placeholder="🔍 Nhập tên món ăn cần tìm...">
        </div>
        <div class="col-md-6 d-flex flex-wrap gap-2 justify-content-md-end" id="category-filter">
            <button class="btn btn-danger active" onclick="filterByCategory('all')">Tất cả</button>
        </div>
    </div>
    <div class="container mt-4">
        <h2 class="text-center mb-4">Thực Đơn Của Chúng Tôi</h2>
        
        <div class="row" id="dish-list">
            <div class="text-center" id="loading-spinner">
                <div class="spinner-border text-danger" role="status"></div>
                <p>Đang tải thực đơn...</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
