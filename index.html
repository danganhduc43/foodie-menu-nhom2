
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 Anh Em</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="#">🍔 3 Anh Em</a>
            <div>
                <a href="#adminSection" class="btn btn-outline-light me-2"><i class="bi bi-shield-lock"></i> Kênh Admin</a>
                <button class="btn btn-outline-warning" data-bs-toggle="offcanvas" data-bs-target="#miniCart">
                    <i class="bi bi-cart-fill"></i> Giỏ hàng <span id="cartCount">(0)</span>
                </button>
            </div>
        </div>
    </nav>

    <section class="container py-5">
        <div class="row mb-4">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="🔍 Tìm món ăn...">
            </div>
            <div class="col-md-6">
                <select id="categoryFilter" class="form-select">
                    <option value="all">Tất cả danh mục</option>
                </select>
            </div>
        </div>

        <div id="loadingSpinner" class="text-center my-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="text-muted mt-2">Đang tải thực đơn từ API...</p>
        </div>

        <div class="row" id="foodList"></div>
    </section>

    <section id="adminSection" class="container py-5 border-top">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow p-4" style="border-radius: 20px;">
                <h3 class="fw-bold text-dark mb-4">
                    <i class="bi bi-plus-circle-fill text-warning"></i> Admin - Thêm Món Ăn Mới
                </h3>
                
                <form id="addFoodForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên món ăn</label>
                        <input type="text" id="adminFoodName" class="form-control" placeholder="Ví dụ: Cơm gà xối mỡ">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Danh mục</label>
                            <select id="adminFoodCategory" class="form-select" required>
                                <option value="">Đang tải danh mục...</option>
                                <option value="">pho</option>
                                <option value="">mi</option>
                                <option value="">com </option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Giá tiền (VNĐ)</label>
                            <input type="number" id="adminFoodPrice" class="form-control" placeholder="Ví dụ: 50000">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Đường dẫn ảnh (URL)</label>
                        <input type="text" id="adminFoodImage" class="form-control" placeholder="https://images.unsplash.com/...">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Mô tả ngắn</label>
                        <textarea id="adminFoodDesc" class="form-control" rows="2" placeholder="Ngon giòn, đậm vị..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2">
                        <i class="bi bi-cloud-arrow-up-fill"></i> LƯU VÀO HỆ THỐNG
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>

    <div class="offcanvas offcanvas-end" id="miniCart">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Giỏ hàng của bạn</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body" id="cartItems"></div>
        <div class="offcanvas-footer p-3 border-top">
            <h5 class="mb-3">Tổng tiền: <span id="cartTotal">0</span> VNĐ</h5>
            <div id="cartFooter"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
